<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07070C">
<title>WaveUnits</title>
<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(56,189,248,.18),transparent),#07070C;font-family:Inter,system-ui,sans-serif;color:#fff;min-height:100vh}
.g{background:linear-gradient(180deg,rgba(24,24,42,.85),rgba(17,17,25,.9));backdrop-filter:blur(20px);border:1px solid rgba(56,189,248,.18);border-radius:1rem}
.m{font-family:'Space Grotesk',monospace}
.t{pointer-events:auto;animation:ti .25s ease-out}
@keyframes ti{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(92vw,420px);height:min(92vw,420px);border:2px solid rgba(56,189,248,.4);border-radius:12px;overflow:hidden;aspect-ratio:1}
.sq{display:flex;align-items:center;justify-content:center;font-size:min(8vw,32px);cursor:pointer;user-select:none;position:relative}
.light{background:#D4C4A8}
.dark{background:#6B5B4A}
.sel{box-shadow:inset 0 0 0 3px #34E27A}
.legal::after{content:'';position:absolute;width:22%;height:22%;border-radius:50%;background:rgba(52,226,122,.6)}
.last{box-shadow:inset 0 0 0 3px rgba(56,189,248,.8)}
</style>
</head>
<body>
<div class="max-w-lg mx-auto px-4 py-5 space-y-4">

  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold">Wave<span class="text-sky-400">Units</span></h1>
      <p class="text-xs text-gray-500 mt-0.5">AI Chess · $WAVEUNITS</p>
    </div>
    <div id="walletBadge" class="text-[10px] px-3 py-1 rounded-full border font-mono bg-gray-600/30 text-gray-300 border-gray-500/40">NO WALLET</div>
  </div>

  <!-- WALLET -->
  <div class="g p-4">
    <p class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold mb-2">1. Connect Wallet</p>
    <button id="connectBtn" class="w-full py-3 rounded-xl font-bold text-sm bg-sky-500 text-black hover:bg-sky-400 transition">Connect Solana Wallet</button>
    <div id="walletInfo" class="hidden mt-3 pt-3 border-t border-white/10">
      <div class="flex items-center justify-between mb-1"><span class="text-[10px] text-gray-500">Address</span><span id="walletAddr" class="m text-xs text-gray-200">—</span></div>
      <div class="flex items-center justify-between"><span class="text-[10px] text-gray-500">$WAVEUNITS</span><span id="tokenBal" class="m text-sm font-bold text-sky-300">—</span></div>
    </div>
  </div>

  <!-- AGENT CREATOR -->
  <div class="g p-4">
    <div class="flex items-center justify-between mb-2">
      <p class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold">2. Create AI Agent</p>
      <span id="agentBadge" class="text-[9px] px-2 py-0.5 rounded-full border font-mono bg-gray-600/30 text-gray-300 border-gray-500/40">NOT SET</span>
    </div>
    <label class="text-[10px] text-gray-500 uppercase block mb-1">Agent Name</label>
    <input id="agentName" type="text" placeholder="e.g. WaveKnight_01" maxlength="24" class="w-full bg-black/40 border border-sky-500/30 rounded-lg px-3 py-2 text-white m text-xs mb-2 focus:outline-none focus:border-sky-500/60">
    <label class="text-[10px] text-gray-500 uppercase block mb-1">LLM Provider</label>
    <select id="llmProvider" class="w-full bg-black/40 border border-sky-500/30 rounded-lg px-3 py-2 text-white text-xs mb-2 focus:outline-none focus:border-sky-500/60">
      <option value="openrouter">OpenRouter</option>
      <option value="openai">OpenAI</option>
    </select>
    <label class="text-[10px] text-gray-500 uppercase block mb-1">API Key</label>
    <input id="apiKey" type="password" placeholder="sk-…" class="w-full bg-black/40 border border-sky-500/30 rounded-lg px-3 py-2 text-white m text-xs mb-2 focus:outline-none focus:border-sky-500/60">
    <label class="text-[10px] text-gray-500 uppercase block mb-1">Chess Strategy</label>
    <textarea id="strategy" rows="3" placeholder="e.g. Play aggressive. Control center." class="w-full bg-black/40 border border-sky-500/30 rounded-lg px-3 py-2 text-white m text-xs mb-2 focus:outline-none focus:border-sky-500/60 resize-none"></textarea>
    <button id="createAgentBtn" class="w-full py-2.5 rounded-lg font-bold text-xs bg-sky-500 text-black hover:bg-sky-400 transition">Create Agent</button>
  </div>

  <!-- PAYSTACK -->
  <div class="g p-4">
    <p class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold mb-2">3. Buy $WAVEUNITS</p>
    <div class="flex items-center justify-between mb-3">
      <div><p id="balanceDisplay" class="text-3xl font-bold m">0</p><p class="text-[10px] text-gray-500">$WAVEUNITS</p></div>
      <button id="buyBtn" class="px-5 py-3 rounded-xl font-bold text-sm bg-green-500 text-black hover:bg-green-400 transition">Buy 1 · KES 10</button>
    </div>
    <div class="flex gap-2">
      <input id="emailInput" type="email" placeholder="you@example.com" class="flex-1 bg-black/40 border border-sky-500/30 rounded-lg px-3 py-2 text-white text-xs focus:outline-none focus:border-sky-500/60">
      <button id="connectEmailBtn" class="px-3 py-2 rounded-lg font-bold text-xs bg-white/5 border border-white/10 hover:bg-white/10 transition">Set</button>
    </div>
  </div>

  <!-- BOARD -->
  <div class="flex justify-center">
    <div id="board"></div>

  <div class="grid grid-cols-3 gap-2">
    <div class="g p-3 text-center"><p class="text-[9px] text-gray-500 uppercase mb-1">Turn</p><p id="turnDisplay" class="text-sm m font-bold text-sky-300">WHITE</p></div>

    <div class="g p-3 text-center"><p class="text-[9px] text-gray-500 uppercase mb-1">Status</p><p id="gameStatus" class="text-sm m font-bold text-green-400">READY</p></div>
  </div>

  <!-- AGENT PLAY -->
  <div class="g p-4">
    <p class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold mb-2">4. Agent Play</p>
    <div class="grid grid-cols-2 gap-2 mb-2">

      <button id="agentAutoBtn" class="py-3 rounded-xl font-bold text-xs bg-white/5 border border-white/10 hover:bg-white/10 transition">Auto: OFF</button>
    </div>
    <p id="agentThink" class="text-[10px] text-sky-300 m text-center hidden">🤖 Agent thinking…</p>
  </div>

    <div class="flex items-center justify-between mb-1">

      <button id="copyFenBtn" class="text-[10px] text-sky-300 hover:text-white">Copy FEN</button>

    <p id="lastMove" class="text-sm m text-sky-300 font-bold mb-2">—</p>
    <div id="moveLog" class="space-y-1 max-h-32 overflow-y-auto text-xs m"><p class="text-gray-500 italic">No moves yet</p></div>

<div id="toastRoot" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 w-full max-w-sm px-4" style="pointer-events:none"></div>

<!-- Load chess.js as ES module, expose to window -->
<script type="module">
  import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';
  window.Chess = Chess;
  // Signal that Chess is ready
  window.dispatchEvent(new Event('chess-ready'));
</script>

<script>
const CONFIG = {
  PAYSTACK_PUBLIC_KEY: 'pk_live_c80851770107f54d0e8b11c4e6a6103ea1e6331aae22711660cd68982cf15e9c',
  FIREBASE_DB_URL: 'https://waveunits-1bed5-default-rtdb.firebaseio.com',
  TOKEN_MINT: 'ACHESSxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx',
  RPC: 'https://api.mainnet-beta.solana.com',
  KES_PER_TOKEN: 10,
};

function toast(msg,type='info'){
  const c={success:'bg-green-500/20 text-green-300 border-green-500/40',danger:'bg-red-500/20 text-red-300 border-red-500/40',info:'bg-sky-500/20 text-sky-300 border-sky-500/40'};
  const d=document.createElement('div');
  d.className=`t px-4 py-2 rounded-lg border text-xs font-semibold shadow-lg ${c[type]}`;
  d.style.background='rgba(17,17,25,.95)';d.style.backdropFilter='blur(12px)';d.textContent=msg;
  document.getElementById('toastRoot').appendChild(d);setTimeout(()=>d.remove(),3000);
}

async function fbGet(p){try{const r=await fetch(`${CONFIG.FIREBASE_DB_URL}/${p}.json`);return r.ok?r.json():null}catch{return null}}
async function fbSet(p,d){try{const r=await fetch(`${CONFIG.FIREBASE_DB_URL}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return r.ok?r.json():null}catch{return null}}
async function fbPush(p,d){try{const r=await fetch(`${CONFIG.FIREBASE_DB_URL}/${p}.json`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return r.ok?r.json():null}catch{return null}}

let walletAddr=null,walletProvider=null,tokenBal=0,userEmail=null,userKey=null,localBalance=0;
let agent={name:null,provider:null,apiKey:null,strategy:null,ready:false};
let agentAutoTimer=null;

// Board state (initialized once Chess is ready)
let game = null;
let selectedSquare = null;
let orientation = 'white';
let lastMoveSquares = [];

const PIECES = {p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚',P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔'};
const boardEl = document.getElementById('board');

function renderBoard(){
  if (!game) return;
  boardEl.innerHTML = '';
  const ranks = orientation === 'white' ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
  const files = orientation === 'white' ? ['a','b','c','d','e','f','g','h'] : ['h','g','f','e','d','c','b','a'];

  for (const rank of ranks) {
    for (const file of files) {
      const sq = file + rank;
      const isLight = (files.indexOf(file) + ranks.indexOf(rank)) % 2 === 0;
      const piece = game.get(sq);
      const div = document.createElement('div');
      div.className = 'sq ' + (isLight ? 'light' : 'dark');
      div.dataset.square = sq;
      if (piece) {
        div.textContent = PIECES[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
        div.style.color = piece.color === 'w' ? '#FFFFFF' : '#111111';
        div.style.textShadow = piece.color === 'w' ? '0 1px 2px rgba(0,0,0,.5)' : '0 1px 2px rgba(255,255,255,.2)';
      }
      if (lastMoveSquares.includes(sq)) div.classList.add('last');
      if (selectedSquare === sq) div.classList.add('sel');
      if (selectedSquare) {
        const legal = game.moves({ square: selectedSquare, verbose: true });
        if (legal.some(m => m.to === sq)) div.classList.add('legal');
      }
      div.addEventListener('click', () => handleSquareClick(sq));
      boardEl.appendChild(div);
    }
  }
}

function handleSquareClick(sq) {
  if (!game) return;
  if (game.isGameOver()) { toast('Game over — reset to play', 'info'); return; }
  const piece = game.get(sq);
  if (selectedSquare) {
    const legal = game.moves({ square: selectedSquare, verbose: true });
    const target = legal.find(m => m.to === sq);
    if (target) {
      try {
        const mv = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
        toast(`Legal: ${mv.san}`, 'success');
        selectedSquare = null;
        lastMoveSquares = [mv.from, mv.to];
        renderBoard();
        updateUI(mv);
        return;
      } catch (err) {
        toast('Illegal move', 'danger');
        selectedSquare = null;
        renderBoard();
        return;
      }
    }
    if (piece && piece.color === game.turn()) {
      selectedSquare = sq;
      renderBoard();
      return;
    }
    selectedSquare = null;
    renderBoard();
    return;
  }
  if (piece && piece.color === game.turn()) {
    selectedSquare = sq;
    renderBoard();
  } else if (piece) {
    toast('Not your turn', 'danger');
  }
}

function renderLog(){
  if (!game) return;
  const log=document.getElementById('moveLog');
  const h=game.history({verbose:true});
  if(!h.length){log.innerHTML='<p class="text-gray-500 italic">No moves yet</p>';return}
  log.innerHTML=h.map((m,i)=>{
    const n=Math.floor(i/2)+1,s=i%2===0?'w':'b';
    return `<div class="flex items-center gap-2 bg-black/30 rounded px-2 py-1"><span class="text-gray-500 w-6">${s==='w'?n+'.':''}</span><span class="text-sky-300 font-bold">${m.san}</span><span class="text-gray-500 text-[10px]">${m.from}-${m.to}</span></div>`;
  }).join('');
}

function updateUI(lm=null){
  if (!game) return;
  document.getElementById('turnDisplay').textContent=game.turn()==='w'?'WHITE':'BLACK';
  document.getElementById('moveCount').textContent=game.history().length;
  if(lm)document.getElementById('lastMove').textContent=`${lm.from}-${lm.to} (${lm.san})`;
  const s=document.getElementById('gameStatus');
  if(game.isCheckmate()){s.textContent='CHECKMATE';s.className='text-sm m font-bold text-red-400'}
  else if(game.isDraw()){s.textContent='DRAW';s.className='text-sm m font-bold text-yellow-400'}
  else if(game.isCheck()){s.textContent='CHECK';s.className='text-sm m font-bold text-orange-400'}
  else{s.textContent='LIVE';s.className='text-sm m font-bold text-green-400'}
  renderLog();
}

// ============ WALLET ============
function detectWallet(){
  if(window.phantom?.solana?.isPhantom)return{p:window.phantom.solana,n:'Phantom'};
  if(window.solflare?.isSolflare)return{p:window.solflare,n:'Solflare'};
  if(window.backpack?.isBackpack)return{p:window.backpack,n:'Backpack'};
  if(window.glow?.isGlow)return{p:window.glow,n:'Glow'};
  return null;
}

async function connectWallet(){
  const btn=document.getElementById('connectBtn');
  const d=detectWallet();
  if(!d){toast('Install Phantom, Solflare, Backpack or Glow','danger');return}
  btn.disabled=true;btn.textContent='Connecting…';
  try{
    const r=await d.p.connect();
    walletAddr=r.publicKey.toString();walletProvider=d.n;
    document.getElementById('walletBadge').textContent=d.n;
    document.getElementById('walletBadge').className='text-[10px] px-3 py-1 rounded-full border font-mono bg-green-500/20 text-green-300 border-green-500/40';
    document.getElementById('walletInfo').classList.remove('hidden');
    document.getElementById('walletAddr').textContent=walletAddr.slice(0,4)+'…'+walletAddr.slice(-4);
    btn.textContent=`Connected via ${d.n}`;
    await checkBalance();
    toast(`Connected via ${d.n}`,'success');
  }catch(e){toast('Connection rejected','danger');btn.disabled=false;btn.textContent='Connect Solana Wallet'}
}

async function checkBalance(){
  if(!walletAddr)return;
  try{
    const body={jsonrpc:'2.0',id:1,method:'getTokenAccountsByOwner',params:[walletAddr,{mint:CONFIG.TOKEN_MINT},{encoding:'jsonParsed'}]};
    const res=await fetch(CONFIG.RPC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await res.json();
    let t=0;for(const a of(j.result?.value||[]))t+=a.account.data.parsed.info.tokenAmount.uiAmount||0;
    tokenBal=t;
    document.getElementById('tokenBal').textContent=t.toLocaleString()+' $WAVEUNITS';
    document.getElementById('tokenBal').className='m text-sm font-bold '+(t>=1?'text-green-300':'text-red-300');
  }catch{document.getElementById('tokenBal').textContent='—'}
}

// ============ EMAIL / PAYSTACK ============
async function setEmail(){
  const e=document.getElementById('emailInput').value.trim();
  if(!e||!e.includes('@')){toast('Enter valid email','danger');return}
  userEmail=e;userKey=e.replace(/[.#$\[\]]/g,'_').toLowerCase();
  const ex=await fbGet('users/'+userKey);
  if(!ex){await fbSet('users/'+userKey,{email:e,balance:0,createdAt:Date.now()});localBalance=0}
  else localBalance=ex.balance||0;
  document.getElementById('balanceDisplay').textContent=localBalance;
  toast('Email set','success');
}

function buyTokens(){
  if(!userEmail){toast('Set your email first','danger');return}
  if(typeof PaystackPop === 'undefined'){toast('Paystack not loaded','danger');return}
  const h=PaystackPop.setup({
    key:CONFIG.PAYSTACK_PUBLIC_KEY,email:userEmail,
    amount:CONFIG.KES_PER_TOKEN*100,currency:'KES',
    ref:'WU_'+Date.now()+'_'+Math.floor(Math.random()*1e6),
    callback:r=>handlePaySuccess(r.reference),
    onClose:()=>toast('Payment closed','info')
  });
  h.openIframe();
}

async function handlePaySuccess(ref){
  toast('Payment received','success');
  await fbPush('transactions/'+userKey,{reference:ref,amountKes:CONFIG.KES_PER_TOKEN,tokens:1,ts:Date.now(),verified:false});
  localBalance+=1;
  await fbSet('users/'+userKey+'/balance',localBalance);
  document.getElementById('balanceDisplay').textContent=localBalance;
  toast('+1 $WAVEUNITS','success');
}

// ============ AGENT ============
function createAgent(){
  const name=document.getElementById('agentName').value.trim();
  const provider=document.getElementById('llmProvider').value;
  const key=document.getElementById('apiKey').value.trim();
  const strategy=document.getElementById('strategy').value.trim();
  if(!name){toast('Enter agent name','danger');return}
  if(!key||key.length<10){toast('Enter valid API key','danger');return}
  if(!strategy){toast('Enter chess strategy','danger');return}
  agent={name,provider,apiKey:key,strategy,ready:true};
  document.getElementById('agentBadge').textContent=name;
  document.getElementById('agentBadge').className='text-[9px] px-2 py-0.5 rounded-full border font-mono bg-green-500/20 text-green-300 border-green-500/40';
  toast(`Agent "${name}" created`,'success');
}

async function askLLM() {
  if (!game) return null;
  const legal = game.moves({ verbose: true });
  if (legal.length === 0) return null;
  const legalStr = legal.map(m => `${m.from}-${m.to}${m.promotion ? '=' + m.promotion : ''}`).join(', ');
  const turn = game.turn() === 'w' ? 'White' : 'Black';
  const prompt = `You are a chess AI. Strategy: "${agent.strategy}"
Board (FEN): ${game.fen()}
Turn: ${turn}
Legal moves: ${legalStr}
Reply with ONLY the move like "e2-e4". No other text.`;

  const endpoint = agent.provider === 'openrouter'
    ? 'https://openrouter.ai/api/v1/chat/completions'
    : 'https://api.openai.com/v1/chat/completions';
  const model = agent.provider === 'openrouter' ? 'openai/gpt-4o-mini' : 'gpt-4o-mini';

  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${agent.apiKey}` },
    body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], max_tokens: 20, temperature: 0.7 })
  });
  if (!res.ok) throw new Error(`LLM ${res.status}: ${(await res.text()).slice(0,80)}`);
  const data = await res.json();
  const text = data.choices?.[0]?.message?.content?.trim() || '';
  const match = text.match(/([a-h][1-8])-([a-h][1-8])(?:=([qrbn]))?/i);
  if (!match) throw new Error(`No move in: "${text.slice(0,40)}"`);
  return `${match[1]}-${match[2]}${match[3] ? '=' + match[3].toLowerCase() : ''}`;
}

function tryMove(moveStr) {
  if (!game) return null;
  const [from, rest] = moveStr.split('-');
  const [to, promo] = rest.includes('=') ? rest.split('=') : [rest, undefined];
  try { return game.move({ from, to, promotion: promo || 'q' }); }
  catch { return null; }
}

async function agentMove() {
  if (!agent.ready) { toast('Create agent first','danger'); return; }
  if (!game) { toast('Board not ready','danger'); return; }
  if (game.isGameOver()) { toast('Game over','info'); return; }
  const thinkEl = document.getElementById('agentThink');
  thinkEl.classList.remove('hidden');
  try {
    let moveStr = await askLLM();
    let result = tryMove(moveStr);
    if (!result) {
      toast(`Illegal ${moveStr} — retry`, 'danger');
      moveStr = await askLLM();
      result = tryMove(moveStr);
      if (!result) throw new Error(`Still illegal: ${moveStr}`);
    }
    lastMoveSquares = [result.from, result.to];
    selectedSquare = null;
    renderBoard();
    updateUI(result);
    toast(`Agent: ${result.san}`, 'success');
  } catch (err) {
    console.error(err);
    toast(`Agent: ${err.message.slice(0,80)}`, 'danger');
  } finally {
    thinkEl.classList.add('hidden');
  }
}

// ============ BINDINGS ============
document.getElementById('connectBtn').onclick = connectWallet;
document.getElementById('connectEmailBtn').onclick = setEmail;
document.getElementById('buyBtn').onclick = buyTokens;
document.getElementById('createAgentBtn').onclick = createAgent;
document.getElementById('agentMoveBtn').onclick = agentMove;
document.getElementById('agentAutoBtn').onclick = () => {
  const btn = document.getElementById('agentAutoBtn');
  if (agentAutoTimer) {
    clearInterval(agentAutoTimer);
    agentAutoTimer = null;
    btn.textContent = 'Auto: OFF';
    btn.className = 'py-3 rounded-xl font-bold text-xs bg-white/5 border border-white/10 hover:bg-white/10 transition';
  } else {
    if (!agent.ready) { toast('Create agent first','danger'); return; }
    agentAutoTimer = setInterval(agentMove, 4000);
    btn.textContent = 'Auto: ON';
    btn.className = 'py-3 rounded-xl font-bold text-xs bg-green-500/20 border border-green-500/40 text-green-300 transition';
  }
};
document.getElementById('resetBtn').onclick = () => {
  if (!game) return;
  game.reset();
  selectedSquare = null;
  lastMoveSquares = [];
  if (agentAutoTimer) { clearInterval(agentAutoTimer); agentAutoTimer = null; document.getElementById('agentAutoBtn').textContent = 'Auto: OFF'; }
  renderBoard();
  document.getElementById('lastMove').textContent = '—';
  updateUI();
  toast('Reset','info');
};
document.getElementById('flipBtn').onclick = () => {
  orientation = orientation === 'white' ? 'black' : 'white';
  renderBoard();
  toast('Flipped','info');
};
document.getElementById('copyFenBtn').onclick = async () => {
  if (!game) return;
  try { await navigator.clipboard.writeText(game.fen()); toast('FEN copied','success'); }
  catch { toast('Copy failed','danger'); }
};

// ============ INIT (wait for Chess to load) ============
function initBoard() {
  game = new window.Chess();
  renderBoard();
  updateUI();
}

if (window.Chess) {
  initBoard();
} else {
  window.addEventListener('chess-ready', initBoard);
}
</script>
</body>
</html>
